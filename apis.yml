aid: redcircle
name: RedCircle
description: >-
  RedCircle is a podcast advertising, hosting, and monetization platform founded
  in 2018 that turns podcast host-read endorsements into measurable results for
  brands and creators. For podcasters it provides podcast hosting, RSS
  distribution to directories, dynamic ad insertion, a cross-promotions
  marketplace, instant payouts, automated transcript and video generation, and
  audience analytics. For brands it operates a fully managed host-read ad
  platform that pairs proprietary data with authentic creator voices to run and
  measure campaigns at scale. RedCircle also documents OpenRAP, its remote
  ad-pipeline / VAST configuration for dynamic ad insertion. The platform is
  offered as SaaS tiers (Growth, Pro, and Enterprise) rather than as a public
  developer API; there is no published developer portal, OpenAPI, or SDK.
